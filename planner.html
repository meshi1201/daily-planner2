<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --green1:#2d6a4f;
  --green2:#52b788;
  --green3:#95d5b2;
  --green4:#b7e4c7;
  --green5:#d8f3dc;
  --green6:#eaf7ee;
  --green7:#f4faf5;
  --sage:#8fae9a;
  --mint:#c2e8ce;
  --text:#1b3a2d;
  --text2:#4a7a5e;
  --text3:#8db09a;
  --border:#c4dece;
  --bg:#ffffff;
  --font:'Hiragino Kaku Gothic ProN','Hiragino Sans','Meiryo',sans-serif;
  --radius:16px;
  --radius-sm:10px;
}

body{
  font-family:var(--font);
  background:var(--green6);
  color:var(--text);
  min-height:100vh;
  padding-bottom:env(safe-area-inset-bottom,0);
}

/* ===== ホーム画面 ===== */
#home-screen{display:block;}
#detail-screen{display:none;}

/* ヘッダー */
.home-header{
  background:var(--bg);
  border-bottom:0.5px solid var(--border);
  padding:14px 16px 12px;
  padding-top:calc(14px + env(safe-area-inset-top,0));
  position:sticky;top:0;z-index:10;
}
.home-header-inner{
  display:flex;align-items:center;justify-content:space-between;
  max-width:500px;margin:0 auto;
}
.home-title{
  font-size:17px;font-weight:700;color:var(--green1);
  letter-spacing:.02em;
}
.home-title span{color:var(--green2);}
.header-deco{font-size:12px;color:var(--green3);letter-spacing:.1em;}

/* 月ラベル */
.month-header{
  max-width:500px;margin:0 auto;
  padding:18px 16px 6px;
  font-size:12px;font-weight:700;
  color:var(--text2);letter-spacing:.08em;
  text-transform:uppercase;
}

/* 日付カードリスト */
.day-list{
  max-width:500px;margin:0 auto;
  padding:0 12px 24px;
  display:flex;flex-direction:column;gap:8px;
}

/* 日付カード（週間記録ページ風） */
.day-card{
  background:var(--bg);
  border-radius:var(--radius);
  border:0.5px solid var(--border);
  overflow:hidden;
  cursor:pointer;
  transition:transform .12s, box-shadow .12s;
  display:flex;
  min-height:72px;
}
.day-card:hover,.day-card:active{
  transform:translateY(-2px);
  box-shadow:0 6px 20px rgba(82,183,136,.18);
}
.day-card.today{
  border-color:var(--green2);
  box-shadow:0 0 0 1.5px var(--green3);
}

/* 左の日付バー */
.day-card-left{
  width:68px;min-width:68px;
  background:linear-gradient(160deg,var(--green5),var(--green4));
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:10px 6px;gap:2px;
  border-right:0.5px solid var(--border);
  position:relative;
}
.day-card.today .day-card-left{
  background:linear-gradient(160deg,var(--green3),var(--green2));
}
.day-weekday{
  font-size:10px;font-weight:600;color:var(--text2);
  letter-spacing:.06em;text-transform:uppercase;
}
.day-card.today .day-weekday{color:var(--green1);}
.day-num-big{
  font-size:26px;font-weight:700;
  color:var(--green1);line-height:1;
}
.day-card.today .day-num-big{color:var(--bg);}
.day-card.today .day-card-left::after{
  content:'今日';
  position:absolute;bottom:6px;
  font-size:9px;font-weight:700;
  color:rgba(255,255,255,.85);
  letter-spacing:.04em;
}

/* 右のコンテンツ */
.day-card-right{
  flex:1;padding:10px 14px;
  display:flex;flex-direction:column;justify-content:space-between;
}
.day-card-top{
  display:flex;align-items:center;justify-content:space-between;
}
.day-icons{display:flex;align-items:center;gap:6px;}
.day-weather{font-size:18px;}
.day-mood{font-size:18px;}
.day-sleep{
  font-size:11px;color:var(--text3);
  display:flex;align-items:center;gap:3px;
}
.day-sleep-num{color:var(--text2);font-weight:600;}

/* 活動量バー */
.day-activity-row{
  display:flex;align-items:center;gap:8px;margin-top:6px;
}
.day-activity-label{font-size:10px;color:var(--text3);min-width:28px;}
.day-activity-track{
  flex:1;height:4px;background:var(--green5);
  border-radius:99px;overflow:hidden;
}
.day-activity-fill{
  height:100%;
  background:linear-gradient(90deg,var(--green3),var(--green2));
  border-radius:99px;
}
.day-activity-pct{font-size:10px;color:var(--text2);min-width:26px;text-align:right;font-weight:500;}

/* やりたいことプレビュー */
.day-todos{
  display:flex;flex-wrap:wrap;gap:4px;margin-top:7px;
}
.day-todo-chip{
  font-size:10px;color:var(--text2);
  background:var(--green6);border:0.5px solid var(--border);
  border-radius:99px;padding:2px 8px;
  max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.day-todo-chip.done{
  text-decoration:line-through;color:var(--text3);background:var(--green7);
}
.day-empty{
  font-size:11px;color:var(--text3);font-style:italic;
}

/* 矢印 */
.day-arrow{
  font-size:13px;color:var(--green3);
  align-self:center;padding-right:4px;flex-shrink:0;
}

/* ===== 詳細画面 ===== */
.detail-header{
  background:var(--bg);
  border-bottom:0.5px solid var(--border);
  padding:12px 16px;
  padding-top:calc(12px + env(safe-area-inset-top,0));
  position:sticky;top:0;z-index:10;
  display:flex;align-items:center;gap:12px;
}
.back-btn{
  background:var(--green6);border:0.5px solid var(--border);
  border-radius:var(--radius-sm);padding:6px 12px;
  cursor:pointer;font-size:13px;color:var(--green1);
  font-family:var(--font);font-weight:500;
}
.back-btn:hover{background:var(--green5);}
.detail-date{font-size:15px;font-weight:600;color:var(--text);}
.detail-nav{margin-left:auto;display:flex;gap:6px;}
.detail-nav button{
  background:var(--green6);border:0.5px solid var(--border);
  border-radius:var(--radius-sm);padding:5px 10px;
  cursor:pointer;font-size:13px;color:var(--green1);font-family:var(--font);
}

.detail-body{max-width:500px;margin:0 auto;padding:14px 12px 40px;}

/* カード共通 */
.card{
  background:var(--bg);border:0.5px solid var(--border);
  border-radius:var(--radius);padding:14px;
  position:relative;overflow:hidden;margin-bottom:10px;
}
.card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--green3),var(--green5),var(--green3));
}
.card-dot{
  position:absolute;top:11px;right:11px;
  width:7px;height:7px;background:var(--green2);border-radius:50%;
}
.card-title{
  font-size:11px;font-weight:700;color:var(--green1);
  text-transform:uppercase;letter-spacing:.07em;
  margin-bottom:10px;margin-top:4px;
  display:flex;align-items:center;gap:5px;
}
.deco{font-size:12px;letter-spacing:.02em;text-transform:none;color:var(--green2);}

/* トップ情報 */
.info-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px;}
.info-card{
  background:var(--bg);border:0.5px solid var(--border);
  border-radius:var(--radius-sm);padding:10px;
  position:relative;overflow:hidden;
}
.info-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--green3),var(--green5),var(--green3));
}
.info-label{font-size:10px;color:var(--text3);font-weight:600;letter-spacing:.05em;text-transform:uppercase;margin-bottom:5px;}
.weather-row{display:flex;flex-wrap:wrap;gap:4px;}
.w-btn{
  font-size:17px;background:var(--green7);border:0.5px solid var(--border);
  border-radius:8px;padding:3px 5px;cursor:pointer;
  transition:background .1s,transform .1s;
}
.w-btn:hover{transform:scale(1.15);}
.w-btn.selected{background:var(--green4);border-color:var(--green2);}
.sleep-wrap{display:flex;align-items:baseline;gap:3px;margin-top:2px;}
.sleep-input{
  font-size:20px;font-weight:700;color:var(--green1);
  border:none;outline:none;background:transparent;
  width:46px;font-family:var(--font);
}
.sleep-unit{font-size:11px;color:var(--text3);}
.act-pct{font-size:16px;font-weight:700;color:var(--green1);margin-top:2px;}
.act-track{
  height:7px;background:var(--green5);border-radius:99px;
  overflow:hidden;cursor:pointer;margin-top:5px;
}
.act-fill{
  height:100%;background:linear-gradient(90deg,var(--green3),var(--green2));
  border-radius:99px;transition:width .2s;
}
.act-hint{font-size:9px;color:var(--text3);margin-top:3px;}

/* タイムライン */
.tl-container{max-height:300px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--border) transparent;}
.tl-row{
  display:flex;align-items:flex-start;gap:8px;
  min-height:34px;border-top:0.5px solid var(--green6);padding:3px 0;
}
.tl-label{
  font-size:10px;color:var(--text3);min-width:44px;padding-top:4px;
}
.tl-label.mark{color:var(--green2);font-weight:700;}
.tl-input{
  flex:1;min-height:24px;border-radius:5px;padding:2px 8px;
  font-size:12px;color:var(--green1);background:transparent;
  outline:none;border:0.5px solid transparent;
  transition:background .15s;resize:none;font-family:var(--font);
}
.tl-input:hover,.tl-input:focus{background:var(--green6);border-color:var(--border);}
.tl-input.has-content{background:var(--green5);border-color:var(--green4);}

/* やりたいこと */
.todo-list{display:flex;flex-direction:column;gap:5px;}
.todo-item{
  display:flex;align-items:center;gap:8px;
  padding:5px 8px;border-radius:var(--radius-sm);
  transition:background .1s;
}
.todo-item:hover{background:var(--green7);}
.todo-item.done .todo-text{text-decoration:line-through;color:var(--text3);}
.todo-check{
  width:15px;height:15px;border:1.5px solid var(--green3);
  border-radius:4px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  transition:background .15s;
}
.todo-check.checked{background:var(--green2);border-color:var(--green2);}
.todo-check.checked::after{
  content:'';width:6px;height:4px;
  border-left:1.5px solid white;border-bottom:1.5px solid white;
  transform:rotate(-45deg) translateY(-1px);display:block;
}
.todo-text{
  font-size:13px;color:var(--text);flex:1;
  outline:none;border:none;background:transparent;
  font-family:var(--font);min-width:0;
}
.todo-del{opacity:0;background:none;border:none;cursor:pointer;color:var(--text3);font-size:14px;padding:2px;}
.todo-item:hover .todo-del{opacity:1;}
.add-btn{
  display:flex;align-items:center;gap:6px;font-size:12px;
  color:var(--green2);background:none;
  border:0.5px dashed var(--green3);border-radius:var(--radius-sm);
  padding:5px 10px;cursor:pointer;width:100%;margin-top:6px;
  transition:background .1s;font-family:var(--font);
}
.add-btn:hover{background:var(--green7);}

/* メモ */
.sub-label{
  font-size:10px;color:var(--text3);margin-bottom:5px;margin-top:12px;
  display:flex;align-items:center;gap:5px;letter-spacing:.04em;font-weight:600;
}
.deco-muted{font-size:12px;color:var(--text3);}
.mood-row{display:flex;gap:6px;margin-bottom:4px;flex-wrap:wrap;}
.mood-btn{
  font-size:17px;background:var(--green7);
  border:0.5px solid var(--border);border-radius:99px;
  padding:4px 10px;cursor:pointer;
  transition:background .1s,transform .1s;
}
.mood-btn:hover{background:var(--green5);transform:scale(1.1);}
.mood-btn.selected{background:var(--green4);border-color:var(--green2);box-shadow:0 0 0 2px var(--green3);}
.soft-div{height:0.5px;background:var(--border);margin:10px 0;border:none;}
.memo-area{
  width:100%;min-height:68px;font-size:13px;font-family:var(--font);
  color:var(--text);background:var(--green7);
  border:0.5px solid var(--border);border-radius:var(--radius-sm);
  padding:10px 12px;resize:vertical;outline:none;line-height:1.7;
}
.memo-area:focus{border-color:var(--green2);background:var(--green6);}
.ref-area{
  width:100%;min-height:55px;font-size:13px;font-family:var(--font);
  color:var(--text);background:var(--bg);
  border:0.5px solid var(--border);border-radius:var(--radius-sm);
  padding:10px 12px;resize:vertical;outline:none;line-height:1.7;margin-top:8px;
}
.ref-area:focus{border-color:var(--green2);}
.save-ind{font-size:11px;color:var(--green2);text-align:right;margin-top:6px;height:16px;transition:opacity .3s;}
.bottom-deco{text-align:center;font-size:12px;color:var(--border);margin-top:10px;letter-spacing:.15em;user-select:none;}
</style>
</head>
<body>

<!-- ===== ホーム画面 ===== -->
<div id="home-screen">
  <div class="home-header">
    <div class="home-header-inner">
      <div class="home-title">きろく <span>✦</span></div>
      <div class="header-deco">⋆ ˚ . ꙳</div>
    </div>
  </div>
  <div id="day-list-container"></div>
</div>

<!-- ===== 詳細画面 ===== -->
<div id="detail-screen">
  <div class="detail-header">
    <button class="back-btn" onclick="goHome()">← もどる</button>
    <span class="detail-date" id="detail-date-label"></span>
    <div class="detail-nav">
      <button onclick="changeDate(-1)">‹</button>
      <button onclick="changeDate(1)">›</button>
    </div>
  </div>
  <div class="detail-body">

    <!-- トップ情報 -->
    <div class="info-grid">
      <div class="info-card">
        <div class="info-label">天気</div>
        <div class="weather-row" id="weather-btns"></div>
      </div>
      <div class="info-card">
        <div class="info-label">睡眠</div>
        <div class="sleep-wrap">
          <input class="sleep-input" id="sleep-input" type="number" min="0" max="24" step="0.5" placeholder="7" oninput="saveInfo()">
          <span class="sleep-unit">h</span>
        </div>
      </div>
      <div class="info-card">
        <div class="info-label">活動量</div>
        <div class="act-pct" id="act-pct">0%</div>
        <div class="act-track" id="act-track">
          <div class="act-fill" id="act-fill" style="width:0%"></div>
        </div>
        <div class="act-hint">タップで変更</div>
      </div>
    </div>

    <!-- タイムライン -->
    <div class="card">
      <div class="card-dot"></div>
      <div class="card-title">⏱ タイムライン</div>
      <div class="tl-container" id="tl-list"></div>
    </div>

    <!-- やりたいこと -->
    <div class="card">
      <div class="card-dot"></div>
      <div class="card-title">✦ やりたいこと <span class="deco">̳ˆ. ⩊ .ˆ ̳</span></div>
      <div class="todo-list" id="todo-list"></div>
      <button class="add-btn" onclick="addTodo()">＋ 追加</button>
    </div>

    <!-- メモ・振り返り -->
    <div class="card">
      <div class="card-dot"></div>
      <div class="card-title">✎ メモ・振り返り</div>
      <div class="sub-label">きもち</div>
      <div class="mood-row" id="mood-row">
        <button class="mood-btn" onclick="setMood(0)">😄</button>
        <button class="mood-btn" onclick="setMood(1)">🙂</button>
        <button class="mood-btn" onclick="setMood(2)">😐</button>
        <button class="mood-btn" onclick="setMood(3)">😔</button>
        <button class="mood-btn" onclick="setMood(4)">😩</button>
      </div>
      <hr class="soft-div">
      <div class="sub-label">メモ <span class="deco-muted">🪄︎︎◝✩</span></div>
      <textarea class="memo-area" id="memo-area" placeholder="今日のメモ、アイデア、気になること…" oninput="autosave()"></textarea>
      <div class="sub-label">振り返り <span class="deco-muted">̳ˆ. ⩊ .ˆ ̳</span></div>
      <textarea class="ref-area" id="ref-area" placeholder="今日うまくいったこと、明日に活かしたいこと…" oninput="autosave()"></textarea>
      <div class="save-ind" id="save-ind"></div>
    </div>

    <div class="bottom-deco">˚ ⋆ ꙳ . ✦ ˚ ⋆ . ꙳ ✦ ˚</div>
  </div>
</div>

<script>
const WEATHERS=['☀️','⛅','☁️','🌧️','🌨️','⛈️','🌫️'];
const MOODS=['😄','🙂','😐','😔','😩'];
const HOURS=[];for(let h=4;h<=27;h++)HOURS.push(h);

let currentDate=new Date();
let selectedMood=-1;
let saveTimer=null;

function dk(d){return d.toISOString().slice(0,10);}
function gS(k){try{const r=localStorage.getItem('pkr_'+k);return r?JSON.parse(r):null;}catch{return null;}}
function sS(k,v){try{localStorage.setItem('pkr_'+k,JSON.stringify(v));}catch{}}

function fmtDate(d){
  const days=['日','月','火','水','木','金','土'];
  return d.getMonth()+1+'月'+d.getDate()+'日（'+days[d.getDay()]+'）';
}
function fmtDateFull(d){
  const days=['日','月','火','水','木','金','土'];
  return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日（'+days[d.getDay()]+'）';
}
function fmtHour(h){return h<=23?h+':00':(h-24)+':00(+1)';}

// ===== 画面切り替え =====
function goHome(){
  document.getElementById('home-screen').style.display='block';
  document.getElementById('detail-screen').style.display='none';
  renderHome();
}
function openDetail(d){
  currentDate=new Date(d);
  document.getElementById('home-screen').style.display='none';
  document.getElementById('detail-screen').style.display='block';
  renderDetail();
}
function changeDate(n){
  currentDate=new Date(currentDate);
  currentDate.setDate(currentDate.getDate()+n);
  renderDetail();
}

// ===== ホーム =====
function renderHome(){
  const container=document.getElementById('day-list-container');
  container.innerHTML='';
  const today=new Date();
  const dates=[];
  // 3ヶ月前〜2週間先
  for(let i=-90;i<=14;i++){
    const d=new Date(today);
    d.setDate(today.getDate()+i);
    dates.push(new Date(d));
  }
  dates.reverse(); // 新しい順

  let curMonth='';
  dates.forEach(d=>{
    const mKey=d.getFullYear()+'/'+(d.getMonth()+1);
    if(mKey!==curMonth){
      curMonth=mKey;
      const ml=document.createElement('div');
      ml.className='month-header';
      ml.textContent=d.getFullYear()+'年'+(d.getMonth()+1)+'月';
      container.appendChild(ml);
    }
    const list=document.createElement('div');
    if(container.querySelector('.day-list[data-month="'+mKey+'"]')){
      container.querySelector('.day-list[data-month="'+mKey+'"]').appendChild(makeCard(d,today));
    }else{
      const dl=document.createElement('div');
      dl.className='day-list';
      dl.setAttribute('data-month',mKey);
      dl.appendChild(makeCard(d,today));
      container.appendChild(dl);
    }
  });
}

function makeCard(d,today){
  const key=dk(d);
  const info=gS('info_'+key)||{};
  const memo=gS('memo_'+key)||{};
  const todos=gS('todo_'+key)||[];
  const isToday=dk(d)===dk(today);
  const days=['日','月','火','水','木','金','土'];

  const card=document.createElement('div');
  card.className='day-card'+(isToday?' today':'');
  card.onclick=()=>openDetail(d);

  // 左バー
  const left=document.createElement('div');
  left.className='day-card-left';
  const wd=document.createElement('div');wd.className='day-weekday';wd.textContent=days[d.getDay()];
  const dn=document.createElement('div');dn.className='day-num-big';dn.textContent=d.getDate();
  left.appendChild(wd);left.appendChild(dn);

  // 右コンテンツ
  const right=document.createElement('div');right.className='day-card-right';

  // 上段：天気・気分・睡眠
  const top=document.createElement('div');top.className='day-card-top';
  const icons=document.createElement('div');icons.className='day-icons';
  if(info.weather){const w=document.createElement('span');w.className='day-weather';w.textContent=info.weather;icons.appendChild(w);}
  if(memo.mood!==undefined){const m=document.createElement('span');m.className='day-mood';m.textContent=MOODS[memo.mood];icons.appendChild(m);}
  if(!info.weather&&memo.mood===undefined){const e=document.createElement('span');e.className='day-empty';e.textContent='記録なし';icons.appendChild(e);}
  const sleepEl=document.createElement('div');sleepEl.className='day-sleep';
  if(info.sleep){sleepEl.innerHTML='🌙 <span class="day-sleep-num">'+info.sleep+'h</span>';}
  top.appendChild(icons);top.appendChild(sleepEl);

  // 活動量バー
  const actRow=document.createElement('div');actRow.className='day-activity-row';
  const actLabel=document.createElement('div');actLabel.className='day-activity-label';actLabel.textContent='活動';
  const actTrack=document.createElement('div');actTrack.className='day-activity-track';
  const actFill=document.createElement('div');actFill.className='day-activity-fill';
  actFill.style.width=(info.activity||0)+'%';
  actTrack.appendChild(actFill);
  const actPct=document.createElement('div');actPct.className='day-activity-pct';actPct.textContent=(info.activity||0)+'%';
  actRow.appendChild(actLabel);actRow.appendChild(actTrack);actRow.appendChild(actPct);

  // やりたいことプレビュー
  const todosEl=document.createElement('div');todosEl.className='day-todos';
  if(todos.length===0){}
  else{
    todos.slice(0,3).forEach(t=>{
      const chip=document.createElement('div');
      chip.className='day-todo-chip'+(t.done?' done':'');
      chip.textContent=t.text||'…';
      todosEl.appendChild(chip);
    });
    if(todos.length>3){
      const more=document.createElement('div');more.className='day-todo-chip';
      more.textContent='+'+(todos.length-3);
      todosEl.appendChild(more);
    }
  }

  right.appendChild(top);right.appendChild(actRow);right.appendChild(todosEl);

  const arrow=document.createElement('div');arrow.className='day-arrow';arrow.textContent='›';

  card.appendChild(left);card.appendChild(right);card.appendChild(arrow);
  return card;
}

// ===== 詳細 =====
function renderDetail(){
  document.getElementById('detail-date-label').textContent=fmtDate(currentDate);
  renderWeather();renderSleepAct();renderTL();renderTodos();renderMemo();
}

function renderWeather(){
  const key=dk(currentDate),info=gS('info_'+key)||{};
  const el=document.getElementById('weather-btns');el.innerHTML='';
  WEATHERS.forEach(w=>{
    const b=document.createElement('button');b.className='w-btn'+((info.weather||'')===w?' selected':'');
    b.textContent=w;b.onclick=()=>{const d=gS('info_'+key)||{};d.weather=w;sS('info_'+key,d);renderWeather();showSaved();};
    el.appendChild(b);
  });
}

function renderSleepAct(){
  const key=dk(currentDate),info=gS('info_'+key)||{};
  document.getElementById('sleep-input').value=info.sleep||'';
  document.getElementById('act-pct').textContent=(info.activity||0)+'%';
  document.getElementById('act-fill').style.width=(info.activity||0)+'%';
}
document.getElementById('act-track').addEventListener('click',function(e){
  const rect=this.getBoundingClientRect();
  const pct=Math.max(0,Math.min(100,Math.round(((e.clientX-rect.left)/rect.width)*100)));
  const key=dk(currentDate),info=gS('info_'+key)||{};
  info.activity=pct;sS('info_'+key,info);renderSleepAct();showSaved();
});
function saveInfo(){
  const key=dk(currentDate),info=gS('info_'+key)||{};
  info.sleep=document.getElementById('sleep-input').value;
  sS('info_'+key,info);showSaved();
}
document.getElementById('sleep-input').addEventListener('input',saveInfo);

function renderTL(){
  const key=dk(currentDate),blocks=gS('tb_'+key)||{};
  const el=document.getElementById('tl-list');el.innerHTML='';
  HOURS.forEach(h=>{
    const row=document.createElement('div');row.className='tl-row';
    const lbl=document.createElement('span');lbl.className='tl-label'+(h%6===0?' mark':'');lbl.textContent=fmtHour(h);
    const ta=document.createElement('textarea');
    ta.className='tl-input'+(blocks[h]?' has-content':'');
    ta.rows=1;ta.value=blocks[h]||'';
    ta.addEventListener('input',function(){
      this.classList.toggle('has-content',this.value.trim().length>0);
      const b=gS('tb_'+key)||{};
      if(this.value.trim())b[h]=this.value;else delete b[h];
      sS('tb_'+key,b);showSaved();
    });
    row.appendChild(lbl);row.appendChild(ta);el.appendChild(row);
  });
}

function renderTodos(){
  const key=dk(currentDate),todos=gS('todo_'+key)||[];
  const el=document.getElementById('todo-list');el.innerHTML='';
  todos.forEach((t,i)=>{
    const item=document.createElement('div');item.className='todo-item'+(t.done?' done':'');
    const check=document.createElement('div');check.className='todo-check'+(t.done?' checked':'');
    check.onclick=()=>{const ts=gS('todo_'+key)||[];ts[i].done=!ts[i].done;sS('todo_'+key,ts);renderTodos();};
    const inp=document.createElement('input');inp.type='text';inp.className='todo-text';inp.value=t.text;inp.placeholder='やりたいこと';
    inp.oninput=function(){const ts=gS('todo_'+key)||[];ts[i].text=this.value;sS('todo_'+key,ts);showSaved();};
    const del=document.createElement('button');del.className='todo-del';del.textContent='×';
    del.onclick=()=>{const ts=gS('todo_'+key)||[];ts.splice(i,1);sS('todo_'+key,ts);renderTodos();};
    item.appendChild(check);item.appendChild(inp);item.appendChild(del);el.appendChild(item);
  });
}
function addTodo(){
  const key=dk(currentDate),todos=gS('todo_'+key)||[];
  todos.push({text:'',done:false});sS('todo_'+key,todos);renderTodos();
  setTimeout(()=>{const i=document.querySelectorAll('.todo-text');if(i.length)i[i.length-1].focus();},50);
}

function renderMemo(){
  const key=dk(currentDate),data=gS('memo_'+key)||{};
  document.getElementById('memo-area').value=data.memo||'';
  document.getElementById('ref-area').value=data.ref||'';
  selectedMood=data.mood!==undefined?data.mood:-1;
  document.querySelectorAll('.mood-btn').forEach((b,i)=>b.classList.toggle('selected',i===selectedMood));
}
function setMood(i){
  selectedMood=i;
  document.querySelectorAll('.mood-btn').forEach((b,j)=>b.classList.toggle('selected',j===i));
  saveMemo();
}
function autosave(){clearTimeout(saveTimer);saveTimer=setTimeout(()=>{saveMemo();showSaved();},600);}
function saveMemo(){
  const key=dk(currentDate);
  sS('memo_'+key,{memo:document.getElementById('memo-area').value,ref:document.getElementById('ref-area').value,mood:selectedMood});
}
function showSaved(){
  const el=document.getElementById('save-ind');el.textContent='✓ 保存しました';el.style.opacity='1';
  clearTimeout(window._sh);window._sh=setTimeout(()=>{el.style.opacity='0';},2000);
}

// 初期表示
renderHome();
</script>
</body>
</html>
